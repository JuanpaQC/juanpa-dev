<!doctype html>
<!--
  Al migrar a juanpaqc.dev, la URL base aparece en:
    · <link rel="canonical">
    · og:url  ·  og:image  ·  twitter:image
    · el bloque JSON-LD de abajo
    · public/robots.txt  y  public/sitemap.xml
  Busca y reemplaza "https://juanpaqc.netlify.app" en esos seis sitios y
  deja un redirect 301 del subdominio antiguo al nuevo.

  lang se sincroniza en runtime desde src/i18n.js; "es" es el idioma por defecto.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============ IDENTIDAD ============ -->
    <title>Juanpa Quesada Caballero — Software Engineer · React Native &amp; Expo</title>
    <meta
      name="description"
      content="Ingeniero de software en Costa Rica. Apps móviles con React Native, Expo y Firebase: sincronización offline-first, integración de APIs y publicación en tiendas. Trabajo con agentes de IA sobre especificaciones escritas."
    />
    <meta name="author" content="Juanpa Quesada Caballero" />
    <link rel="canonical" href="https://juanpaqc.netlify.app/" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <!-- Verificación de propiedad en Google Search Console. No borrar: si
         desaparece, Google revoca el acceso a la propiedad. -->
    <meta name="google-site-verification" content="DOqB0SHznQNQrW_VWNs4S8T_HwpKGbgojqR25J4UMI8" />

    <!-- ============ TIPOGRAFÍA ============
         Antes: cinco familias declaradas en tailwind.config.js y NINGUNA cargada.
         El sitio se pintaba con la fuente del sistema del visitante, así que se
         veía distinto en cada máquina.
         Chakra Petch  -> display. Mismo registro sci-fi que buscaba Orbitron,
                          pero con minúsculas resueltas y pesos reales.
         IBM Plex Mono -> terminal, navbar y datos.
         IBM Plex Sans -> cuerpo. Misma superfamilia que Plex Mono, así que
                          alinean sin trucos.
         El subconjunto `latin` cubre ñ, tildes, ¿ y ¡ sin bytes extra.
         Total: 70 KB en 4 archivos woff2. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />

    <!-- ============ ICONOS ============ -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ============ RENDIMIENTO ============ -->
    <!-- El hero todavía trae su fondo de Unsplash; sin preconnect costaba ~1,2 s en frío -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://api.github.com" crossorigin />
    <!-- Precarga del elemento LCP (el avatar del hero) -->
    <link
      rel="preload"
      as="image"
      href="/avatar-juanpa-700.webp"
      imagesrcset="/avatar-juanpa-350.webp 350w, /avatar-juanpa-700.webp 700w"
      imagesizes="(max-width: 768px) 250px, 350px"
      fetchpriority="high"
    />

    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
